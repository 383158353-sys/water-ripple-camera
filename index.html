        function ensureBgTexture() {

                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        // —— 录屏：只录 WebGL 画布，不含 UI ——
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordStream = null;
        const recordBtn = document.getElementById('btn-record');

        function pickRecorderMime() {
            // 优先 MP4；仅在浏览器不支持时才退回 webm，并提示用户
            const mp4Candidates = [
                'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
                'video/mp4;codecs=avc1.4D401E,mp4a.40.2',
                'video/mp4;codecs=avc1.640028,mp4a.40.2',
                'video/mp4;codecs=avc1.42E01E',
                'video/mp4;codecs=h264,aac',
                'video/mp4'
            ];
            const webmFallback = [
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];
            if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) {
                return { mime: '', isMp4: false, usedFallback: false };
            }
            for (const m of mp4Candidates) {
                try {
                    if (MediaRecorder.isTypeSupported(m)) return { mime: m, isMp4: true, usedFallback: false };
                } catch (_) {}
            }
            for (const m of webmFallback) {
                try {
                    if (MediaRecorder.isTypeSupported(m)) return { mime: m, isMp4: false, usedFallback: true };
                } catch (_) {}
            }
            return { mime: '', isMp4: false, usedFallback: false };
        }

        function recordExtFromMime(mime) {
            if (!mime) return 'mp4';
            if (mime.indexOf('mp4') !== -1) return 'mp4';
            return 'webm';
        }

        function syncRecordBtn() {
            if (recordBtn) {
                recordBtn.classList.toggle('recording', recordingActive);
                recordBtn.classList.toggle('active', recordingActive);
                recordBtn.textContent = recordingActive ? '停止录屏' : '录屏';
                if (!recordingActive) {
                    recordBtn.style.background = 'rgba(0,0,0,0.6)';
                    recordBtn.style.color = '#fff';
                } else {
                    recordBtn.style.background = '#e53935';
                    recordBtn.style.color = '#fff';
                }
            }
            // 录屏中始终显示浮动「停止录屏」（隐藏界面时也能点）
            if (stopRecFloatBtn) {
                stopRecFloatBtn.style.display = recordingActive ? 'inline-flex' : 'none';
            }
        }

        function downloadRecording(blob, mime) {
            let ext = recordExtFromMime(mime || blob.type || '');
            // 尽量落盘为 .mp4；仅明确 webm 时才用 .webm
            if (ext !== 'webm') ext = 'mp4';
            const stamp = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const name = `水面交互_${stamp.getFullYear()}${pad(stamp.getMonth()+1)}${pad(stamp.getDate())}_${pad(stamp.getHours())}${pad(stamp.getMinutes())}${pad(stamp.getSeconds())}.${ext}`;
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            a.rel = 'noopener';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                try { document.body.removeChild(a); } catch (_) {}
                URL.revokeObjectURL(url);
            }, 2500);
            // iPad Safari 常忽略 download，会新开标签页播放；用户可点分享保存到「文件」
            if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
                try {
                    window.open(url, '_blank');
                } catch (_) {}
            }
        }

        function stopCanvasRecording() {
            if (!mediaRecorder) return;
            try {
                if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            } catch (err) {
                showError('停止录屏失败: ' + (err && err.message ? err.message : err));
                recordingActive = false;
                syncRecordBtn();
            }
        }

        function startCanvasRecording() {
            if (recordingActive) return;
            if (typeof MediaRecorder === 'undefined' || typeof canvas.captureStream !== 'function') {
                showError('当前浏览器不支持画布录屏（需较新 Safari / Chrome）');
                return;
            }
            const picked = pickRecorderMime();
            const mime = picked.mime || '';
            recordedChunks = [];
            try {
                // 只捕获 WebGL canvas，界面 DOM 不会进画面；优先 video/mp4
                recordStream = canvas.captureStream(30);
                const opts = mime ? { mimeType: mime, videoBitsPerSecond: 8_000_000 } : { videoBitsPerSecond: 8_000_000 };
                try {
                    mediaRecorder = new MediaRecorder(recordStream, opts);
                } catch (_) {
                    // 强制再试一次纯 mp4
                    try {
                        mediaRecorder = new MediaRecorder(recordStream, { mimeType: 'video/mp4', videoBitsPerSecond: 8_000_000 });
                    } catch (__) {
                        mediaRecorder = new MediaRecorder(recordStream);
                    }
                }
            } catch (err) {
                showError('无法开始录屏: ' + (err && err.message ? err.message : err));
                mediaRecorder = null;
                recordStream = null;
                return;
            }

            mediaRecorder.ondataavailable = (ev) => {
                if (ev.data && ev.data.size > 0) recordedChunks.push(ev.data);
            };
            mediaRecorder.onerror = (ev) => {
                showError('录屏出错');
                recordingActive = false;
                syncRecordBtn();
            };
            mediaRecorder.onstop = () => {
                recordingActive = false;
                syncRecordBtn();
                const usedMime = (mediaRecorder && mediaRecorder.mimeType) || mime || 'video/mp4';
                const container = usedMime.indexOf('mp4') !== -1 ? 'video/mp4' : (usedMime.split(';')[0] || 'video/webm');
                const blob = new Blob(recordedChunks, { type: container });
                recordedChunks = [];
                if (recordStream) {
                    try { recordStream.getTracks().forEach(t => t.stop()); } catch (_) {}
                    recordStream = null;
                }
                mediaRecorder = null;
                if (!blob.size) {
                    showError('录屏为空，请再试一次');
                    showRecToast('录屏失败：没有画面数据', 2800);
                    return;
                }
                downloadRecording(blob, usedMime);
                if (container === 'video/mp4') {
                    showRecToast('录屏已结束，已保存为 MP4（不含界面）。若未自动下载，请用分享存到「文件」。', 4200);
                } else {
                    showRecToast('当前浏览器不支持 MP4 录屏，已改用 WebM 保存。可用 Chrome/Safari 再录以得到 MP4。', 5200);
                    showError('浏览器不支持 video/mp4 录屏，已回退为 WebM');
                }
            };

            try {
                mediaRecorder.start(1000); // timeslice：部分 Safari 更稳
                recordingActive = true;
                syncRecordBtn();
                if (picked.usedFallback) {
                    showRecToast('正在录屏（此浏览器只能 WebM，非 MP4）。点红色「停止录屏」结束保存', 3600);
                    showError('当前浏览器不支持 MP4 录屏，将保存为 WebM');
                } else {
                    showRecToast('正在录屏（MP4）：点红色「停止录屏」结束并保存（画面不含界面）', 2600);
                }
            } catch (err) {
                showError('启动录屏失败: ' + (err && err.message ? err.message : err));
                recordingActive = false;
                syncRecordBtn();
                if (recordStream) {
                    try { recordStream.getTracks().forEach(t => t.stop()); } catch (_) {}
                    recordStream = null;
                }
                mediaRecorder = null;
            }
        }

        function toggleCanvasRecording() {
            if (recordingActive) stopCanvasRecording();
            else startCanvasRecording();
        }

        syncRecordBtn();
        if (recordBtn) {
            recordBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleCanvasRecording();
            });
        }
        if (stopRecFloatBtn) {
            stopRecFloatBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (recordingActive) stopCanvasRecording();
            });
        }


        document.getElementById('btn-camera').addEventListener('click', (e) => {
            e.stopPropagation();
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            initCamera();
        });

        if (gl) {
            initGL();
            initCamera();
            requestAnimationFrame(render);
        } else {
            showError("WebGL not supported");
        }
    </script>
</body>
</html>
